name = "Fsm"
version = "0.0.0"
defaultTargets = ["Fsm"]

[leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

pp.unicode.fun = true

weak.linter.mathlibStandardSet = true

weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "Fsm"
srcDir = "lean"
roots = [
  "Defs",
  "Dispatch",
  "Determinism",
  "Soundness",
  "Reachability",
  "Validity",
  "Expansion",
  "Compose",
  "ComposeSoundness",
  "ComposeAssociativity",
  "Replay",
  "DraftDefs",
  "Draft",
  "DraftCommit",
  "DraftNested",
  "ProtocolDefs",
  "ProtocolDispatch",
  "ProtocolReplay",
  "ProtocolDraft",
  "ProtocolSoundness",
  "ProtocolReceiveDefs",
  "ProtocolReceiveDispatch",
  "ProtocolReceiveReplay",
  "ProtocolReceiveDraft",
  "ProtocolReceiveSoundness",
  "ProjectionDefs",
  "ProjectionNormalize",
  "ProjectionProject",
  "ProjectionPaths",
  "ProjectionInvariants",
  "ProjectionSoundness",
]
